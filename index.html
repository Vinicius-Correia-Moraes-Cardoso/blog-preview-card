<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="icon" type="image/png" href="/images/favicon-32x32.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');
    </style>
<body>
    <article class="blogCard">
    <img 
        class="cardImage" 
        src="/images/illustration-article.svg" 
        alt="A abstract illustration of some punctuation marks."
        height="190"
    />
    <p class="topic bold">Learning</p>
    <p class="published">Published <time datetime="2023-12"> Dec 2023</time></p>
    <h2 class="bold hover-text">HTML & CSS foundations</h2>
    <p id="cardDescription">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    <img class="authorImg" src="/images/image-avatar.webp" alt="A photo of the author of the article.">
    <p class="authorName bold">Greg Hooper</p>
    </article>
</body>
</html>
